services:
  postgres:
    # Zelfde hoofdversie als Neon draait, zodat de tests niet op een andere
    # Postgres draaien dan productie.
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: kleedkamer
      POSTGRES_USER: kleedkamer
      POSTGRES_DB: kleedkamer_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kleedkamer"]
      interval: 2s
      timeout: 3s
      retries: 20
